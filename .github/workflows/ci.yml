name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No engines field or .nvmrc in package.json — 22.x is the Node version
      # this project is actually developed and verified against.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # `next build` (via src/lib/config.ts) validates at module load that
        # APP_DATABASE_URL/AUTH_SECRET/R2_* are non-empty strings, but nothing
        # in the build actually connects to Postgres or R2 — verified locally
        # by running a full `npm run build` against both a real throwaway
        # Postgres database and a completely unreachable one, with identical
        # (successful) results. So these are placeholders to satisfy that
        # validation, not real credentials, and no `services:` container is
        # needed here.
        env:
          APP_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
          AUTH_SECRET: "ci-placeholder-secret-unused"
          R2_ACCOUNT_ID: "ci-placeholder"
          R2_ACCESS_KEY_ID: "ci-placeholder"
          R2_SECRET_ACCESS_KEY: "ci-placeholder"
          R2_BUCKET_NAME: "ci-placeholder"
        run: npm run build
